<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense search results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --ink: #1e293b; --grey: #64748b; --dot: #a8b3c2; --hair: #e2e0da; --accent: #15803d; --bg: #fcfbf8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 20px; }
  #frame { width: 836px; background: var(--bg); color: var(--ink); font-family: Gelasio, Georgia, serif; padding: 38px 48px 30px; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.3px; line-height: 1.15; }
  .cap { margin-top: 10px; font-family: Inter, sans-serif; font-size: 14px; line-height: 1.5; color: var(--grey);  }
  svg { display: block; margin-top: 18px; overflow: visible; }
  .sans { font-family: Inter, sans-serif; }
</style>
</head>
<body>
<div id="frame">
  <h1>Free-text search: each method wins one</h1>
  <p class="cap" id="cap"></p>
  <svg id="chart"></svg>
</div>
<script>
  // Dumbbell rows: grey dot (a) and coloured dot (b) per row, on a shared axis.
  function dumbbell(svg, rows, o) {
    const NS = 'http://www.w3.org/2000/svg';
    const W = 740, labW = o.labW, x0 = labW, x1 = W - o.rightPad;
    const top = o.seriesNames ? 40 : o.labelsAbove ? 40 : 8, gap = o.gap || 62;
    const X = (v) => x0 + (v - o.min) / (o.max - o.min) * (x1 - x0);
    const el = (tag, attrs, text) => {
      const e = document.createElementNS(NS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      if (text != null) e.textContent = text;
      svg.appendChild(e); return e;
    };
    const axisY = top + gap * (rows.length - 1) + (o.axisPad || 44);
    for (const t of o.ticks) {
      el('line', { x1: X(t), x2: X(t), y1: axisY, y2: axisY + 6, stroke: '#cfcbc2', 'stroke-width': 1 });
      el('text', { x: X(t), y: axisY + 28, 'text-anchor': 'middle', class: 'sans', 'font-size': 14, fill: '#64748b' }, t + '%');
    }
    el('line', { x1: x0, x2: x1, y1: axisY, y2: axisY, stroke: '#cfcbc2', 'stroke-width': 1 });
    rows.forEach((r, i) => {
      const y = top + gap * i;
      if (o.labelsAbove) el('text', { x: 0, y: y - 24, 'font-size': 20, fill: '#1e293b' }, r.label);
      else el('text', { x: 0, y, 'dominant-baseline': 'central', 'font-size': 20, fill: '#1e293b' }, r.label);
      const lo = r.a.v < r.b.v ? r.a : r.b, hi = lo === r.a ? r.b : r.a;
      el('line', { x1: X(lo.v), x2: X(hi.v), y1: y, y2: y, stroke: '#cbd2db', 'stroke-width': 2.5 });
      for (const [d, side] of [[lo, -1], [hi, 1]]) {
        const col = d.win ? '#15803d' : '#94a3b8';
        el('circle', { cx: X(d.v), cy: y, r: 7.5, fill: col });
        const txt = el('text', { x: X(d.v) + side * 16, y, 'dominant-baseline': 'central', 'text-anchor': side < 0 ? 'end' : 'start',
          class: 'sans', 'font-size': 16, 'font-weight': d.win ? 600 : 500, fill: d.win ? '#15803d' : '#64748b' });
        const val = document.createElementNS(NS, 'tspan'); val.textContent = d.v.toFixed(1) + '%';
        if (o.inlineNames) {
          const nm = document.createElementNS(NS, 'tspan'); nm.textContent = d.name; nm.setAttribute('font-weight', 400);
          if (side < 0) { txt.appendChild(nm); txt.appendChild(document.createTextNode(' ')); txt.appendChild(val); }
          else { txt.appendChild(val); txt.appendChild(document.createTextNode(' ')); txt.appendChild(nm); }
        } else txt.appendChild(val);
      }
      if (o.seriesNames && i === 0) {
        for (const d of [r.a, r.b])
          el('text', { x: X(d.v), y: y - 26, 'text-anchor': 'middle', class: 'sans', 'font-size': 14,
            'font-weight': d.win ? 600 : 400, fill: d.win ? '#15803d' : '#64748b' }, d.name);
      }
    });
    svg.setAttribute('width', W); svg.setAttribute('height', axisY + 36);
  }

  const S = DATA.examples.search_eval.rows;
  const get = (s, q) => S.find((r) => r.searcher === s && r.query === q);
  const NAMES = { minilm: 'MiniLM', tfidf_text: 'TF-IDF over text' };
  const rows = [['title', 'Recipe title'], ['paraphrase', 'Ingredient sentence']].map(([q, label]) => {
    const [a, b] = ['tfidf_text', 'minilm'].map((s) => ({ v: get(s, q)['hit@6'] * 100, name: NAMES[s] }));
    a.win = a.v > b.v; b.win = !a.win;
    return { label, a, b };
  });
  const fmt = (x) => x.toLocaleString('en-US');
  document.getElementById('cap').textContent =
    `Top-6 hit rate on ${fmt(get('minilm', 'title').n)} title queries and ${fmt(get('minilm', 'paraphrase').n)} ingredient-sentence queries.`;
  dumbbell(document.getElementById('chart'), rows, { min: 0, max: 100, ticks: [0, 25, 50, 75, 100], inlineNames: true, labelsAbove: true, labW: 8, rightPad: 196, gap: 84, axisPad: 34 });
  window.READY = true;
</script>
</body>
</html>
