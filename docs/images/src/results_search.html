<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense search results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400&display=block" rel="stylesheet">
<style>
  :root { --ink: #1f2937; --ink-2: #4b5563; --ink-3: #78716c; --base: #d6d3d1; --grid: #e7e5e4;
          --weak-bg: #fca5a5; --weak-ink: #991b1b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: Gelasio, Georgia, serif; color: var(--ink); padding: 20px; }
  #frame { width: 836px; background: #fff; padding: 30px 30px 22px; }
  h1 { font-size: 25px; font-weight: 700; }
  .sub { margin-top: 6px; font-size: 15px; color: var(--ink-2); }
  .grid { margin-top: 26px; display: grid; grid-template-columns: 150px repeat(2, 1fr); column-gap: 40px; column-gap: 22px; }
  .ph { font-size: 17px; font-weight: 700; padding-bottom: 2px; }
  .pd { font-size: 13px; color: var(--ink-3); line-height: 1.35; padding-bottom: 12px; min-height: 66px; }
  .name { font-size: 15.5px; text-align: right; height: 52px; display: flex; align-items: center; justify-content: flex-end; color: var(--ink); }
  .name.hl { font-weight: 700; }
  .cell { height: 52px; display: flex; align-items: center; position: relative; }
  .track { position: relative; flex: 1; height: 100%; margin-right: 58px; }
  .bar { position: absolute; left: 0; top: 50%; height: 16px; transform: translateY(-50%); background: var(--base); border-radius: 0 3px 3px 0; }
  .bar.hl { background: var(--ink); height: 18px; }
  .bar.weak { background: var(--weak-bg); }
  .val { position: absolute; top: 50%; transform: translateY(-50%); font-size: 14.5px; font-variant-numeric: tabular-nums; padding-left: 6px; white-space: nowrap; }
    .val.hl { font-weight: 700; }
  .val.weak { color: var(--weak-ink); font-weight: 700; }
  .axis { margin-right: 58px; display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); border-top: 1px solid #a8a29e; padding-top: 4px; margin-top: 4px; position: relative; }
  .axis::before, .axis::after { content: ""; position: absolute; top: -1px; height: 5px; border-left: 1px solid #a8a29e; }
  .axis::before { left: 50%; } .axis::after { left: 100%; }
  .axis span:nth-child(2) { position: absolute; left: 50%; transform: translateX(-50%); }
  .axis span:last-child { transform: translateX(50%); }
  .axis span:first-child { transform: translateX(-20%); }
  .cap { margin-top: 22px; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; border-top: 1px solid var(--grid); padding-top: 12px; }
  .cap b { color: var(--ink); font-weight: 600; }
  .win { position: absolute; top: 50%; transform: translateY(-50%); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div id="frame">
  <h1>Free-text search: each searcher wins one</h1>
  <p class="sub">Top-6 hit rate. MiniLM finds a dish from its name; TF-IDF finds it from a list of ingredients.</p>
  <div class="grid" id="grid"></div>
  <p class="cap" id="cap"></p>
</div>
<script>
  const rows = DATA.examples.search_eval.rows;
  const SEARCHERS = [['minilm', 'MiniLM'], ['tfidf_text', 'TF-IDF over text']];
  const STYLES = [
    ['title', 'title queries', 'the dish name, searched against recipe text with the title taken out', 'title'],
    ['paraphrase', 'ingredient-sentence queries', 'cuisine, course and three or four of its ingredients', 'paraphrase'],
  ];
  const EXQ = DATA.examples.search_eval.example_queries;
  const get = (s, q) => rows.find((x) => x.searcher === s && x.query === q);
  let html = '<div></div>' + STYLES.map(([, h, d, k]) => `<div><div class="ph">${h}</div><div class="pd">${d}<br><i style="color:#4b5563">&ldquo;${EXQ[k]}&rdquo;</i></div></div>`).join('');
  for (const [key, label] of SEARCHERS) {
    html += `<div class="name">${label}</div>`;
    for (const [q] of STYLES) {
      const v = get(key, q)['hit@6'] * 100;
      const best = Math.max(...SEARCHERS.map(([k]) => get(k, q)['hit@6'] * 100));
      const win = v === best;
      html += `<div class="cell"><div class="track">
        <div class="bar ${win ? 'hl' : ''}" style="width:${v}%"></div>
        <div class="val ${win ? 'hl' : ''}" style="left:${v}%">${v.toFixed(1)}%</div>
      </div></div>`;
    }
  }
  html += '<div></div>' + STYLES.map(() => '<div class="axis"><span>0</span><span>50%</span><span>100%</span></div>').join('');
  document.getElementById('grid').innerHTML = html;
  const n = (q) => get('minilm', q).n.toLocaleString('en-US');
  document.getElementById('cap').innerHTML =
    `Known-item search on the test split: <b>${n('title')} title queries and ${n('paraphrase')} ingredient-sentence queries</b>, each built from one held-out recipe; a hit means that recipe ranks in the top 6. ` +
    `MiniLM is <code style="font-family:inherit">all-MiniLM-L6-v2</code>; within a style both searchers index the same text. ` +
    `So in the app, ingredient lists go to the learned ranker and free text goes to MiniLM.`;
  window.READY = true;
</script>
</body>
</html>
