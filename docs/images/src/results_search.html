<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense search results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400&display=block" rel="stylesheet">
<style>
  /* Colours are the app's Tailwind classes. */
  :root {
    --ink: #111827; --ink-2: #4b5563;
    --slate-8: #1e293b; --slate-6: #475569; --slate-5: #64748b;
    --chip: #e5e7eb; --chip-ink: #374151;
    --picked: #44403c;                    /* stone-700, a selected chip */
    --bar: #d1d5db; --track: #f3f4f6;
    --shadow: 0 20px 25px -5px rgba(168,162,158,.9), 0 8px 10px -6px rgba(168,162,158,.9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: Gelasio, Georgia, serif; color: var(--ink); padding: 20px; }
  #frame {
    width: 836px; padding: 24px 24px 28px;
    background: #fefefe url("../../../web/src/components/bg.svg") -40px -30px / 400px 400px repeat;
    display: flex; flex-direction: column; gap: 18px;
  }
  .card { background: #fff; border: 2px solid var(--slate-6); border-radius: 8px; box-shadow: var(--shadow); }
  .title { border-color: var(--slate-8); padding: 16px 22px 15px; }
  .title h1 { font-size: 34px; font-weight: 700; line-height: 1.12; }
  .title p { margin-top: 6px; font-size: 16px; color: var(--ink-2); }
  .styles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .style { padding: 14px 16px 18px; display: flex; flex-direction: column; align-items: flex-start; }
  .bars { margin-top: auto; width: 100%; padding-top: 2px; }
  .pill { display: inline-block; border: 2px solid var(--slate-5); background: var(--chip); color: var(--chip-ink); border-radius: 999px; font-size: 17px; font-weight: 600; padding: 1px 14px 3px; }
  .desc { margin-top: 8px; font-size: 14px; line-height: 1.35; color: var(--ink-2); min-height: 38px; }
  .q { margin-top: 8px; display: inline-block; background: var(--chip); color: #1f2937; border-radius: 14px; font-size: 14px; line-height: 1.35; padding: 5px 12px 6px; font-style: italic; }
  .row { margin-top: 14px; }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 15px; color: var(--chip-ink); }
  .lab b { font-size: 18px; font-weight: 700; color: var(--ink); }
  .track { margin-top: 4px; height: 22px; border-radius: 999px; background: var(--track); }
  .bar { height: 100%; border-radius: 999px; background: var(--bar); border: 2px solid var(--slate-5); }
  .row.win .lab { color: var(--ink); font-weight: 700; }
  .row.win .lab b { color: var(--picked); }
  .row.win .bar { background: var(--picked); border-color: var(--picked); }
  .cap { background: #f3f4f6; border-color: #18181b; box-shadow: none; padding: 12px 16px 13px; font-size: 14px; line-height: 1.42; color: var(--chip-ink); }
  .cap b { color: var(--ink); }
</style>
</head>
<body>
<div id="frame">
  <div class="card title">
    <h1>Free-text search: each searcher wins one</h1>
    <p>Top-6 hit rate. MiniLM finds a dish from its name; TF-IDF finds it from a list of ingredients.</p>
  </div>
  <div class="styles" id="styles"></div>
  <div class="card cap" id="cap"></div>
</div>
<script>
  const rows = DATA.examples.search_eval.rows;
  const EXQ = DATA.examples.search_eval.example_queries;
  const SEARCHERS = [['minilm', 'MiniLM'], ['tfidf_text', 'TF-IDF over text']];
  const STYLES = [
    ['title', 'Title queries', 'the dish name, searched against recipe text with the title taken out'],
    ['paraphrase', 'Ingredient-sentence queries', 'cuisine, course and three or four of its ingredients'],
  ];
  const get = (s, q) => rows.find((x) => x.searcher === s && x.query === q);
  document.getElementById('styles').innerHTML = STYLES.map(([q, name, desc]) => {
    const best = Math.max(...SEARCHERS.map(([k]) => get(k, q)['hit@6']));
    const bars = SEARCHERS.map(([k, label]) => {
      const v = get(k, q)['hit@6'];
      return `<div class="row ${v === best ? 'win' : ''}"><div class="lab"><span>${label}</span><b>${(v * 100).toFixed(1)}%</b></div>
        <div class="track"><div class="bar" style="width:${v * 100}%"></div></div></div>`;
    }).join('');
    return `<div class="card style"><span class="pill">${name}</span><p class="desc">${desc}</p>
      <span class="q">&ldquo;${EXQ[q]}&rdquo;</span><div class="bars">${bars}</div></div>`;
  }).join('');
  const n = (q) => get('minilm', q).n.toLocaleString('en-US');
  document.getElementById('cap').innerHTML =
    `Known-item search on the test split: <b>${n('title')} title queries and ${n('paraphrase')} ingredient-sentence queries</b>, each built from one held-out recipe; a hit means that recipe ranks in the top 6. ` +
    `MiniLM is all-MiniLM-L6-v2, and both searchers index the same text. So in the app, ingredient lists go to the learned ranker and free text goes to MiniLM.`;
  window.READY = true;
</script>
</body>
</html>
