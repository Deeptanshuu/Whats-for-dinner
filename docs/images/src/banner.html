<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root { --ink: #1e293b; --grey: #64748b; --light: #94a3b8; --accent: #15803d; --bg: #fcfbf8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 20px; }
  #frame {
    width: 1280px; height: 400px; background: var(--bg); color: var(--ink);
    font-family: Gelasio, Georgia, serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding-bottom: 6px;
  }
  .mark { display: flex; align-items: center; gap: 22px; }
  .mark svg { width: 62px; height: 62px; stroke: var(--ink); margin-top: 4px; }
  .mark h1 { font-size: 92px; font-weight: 600; letter-spacing: -1.5px; line-height: 1; }
  .tag { margin-top: 24px; font-size: 28px; color: var(--grey); }
  .eg { margin-top: 46px; display: flex; align-items: baseline; gap: 18px; font-size: 21px; }
  .typed { font-style: italic; color: var(--grey); }
  .arrow { width: 44px; height: 12px; align-self: center; stroke: var(--grey); }
  .top { color: var(--ink); font-weight: 600; }
  .ms { font-family: Inter, sans-serif; font-size: 18px; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>
<div id="frame">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/>
      <path d="M6 17h12"/>
    </svg>
    <h1>RecipeSense</h1>
  </div>
  <p class="tag">Type what is in your kitchen. Get recipes that use it.</p>
  <div class="eg">
    <span class="typed" id="typed"></span>
    <svg class="arrow" viewBox="0 0 44 12" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M1 6h41M37 1.5 42 6l-5 4.5"/>
    </svg>
    <span class="top">Palak Paneer</span>
    <span class="ms" id="ms"></span>
  </div>
</div>
<script>
  const ex = DATA.examples;
  document.getElementById('typed').textContent = ex.ingredients_example.typed.join(', ');
  document.getElementById('ms').textContent = ex.api_timings.recommend_median_ms + ' ms';
  if (!ex.ingredients_example.top[0].title.startsWith('Palak Paneer')) throw new Error('top result changed');
  window.READY = true;
</script>
</body>
</html>
