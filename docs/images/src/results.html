<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400&display=block" rel="stylesheet">
<style>
  /* Colours are the app's Tailwind classes. */
  :root {
    --ink: #111827; --ink-2: #4b5563; --ink-3: #6b7280;
    --slate-8: #1e293b; --slate-6: #475569; --slate-5: #64748b;
    --chip: #e5e7eb; --chip-ink: #374151;
    --picked: #44403c;                    /* stone-700, a selected chip */
    --bar: #d1d5db;                       /* gray-300 */
    --track: #f3f4f6;                     /* gray-100 */
    --red-bg: #fca5a5; --red-ink: #991b1b;/* red-300 / red-800, the Clear button */
    --shadow: 0 20px 25px -5px rgba(168,162,158,.9), 0 8px 10px -6px rgba(168,162,158,.9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; font-family: Gelasio, Georgia, serif; color: var(--ink); padding: 20px; }
  #frame {
    width: 836px; padding: 24px 24px 28px;
    background: #fefefe url("../../../web/src/components/bg.svg") -40px -30px / 400px 400px repeat;
    display: flex; flex-direction: column; gap: 18px;
  }
  .card { background: #fff; border: 2px solid var(--slate-6); border-radius: 8px; box-shadow: var(--shadow); }
  .title { border-color: var(--slate-8); padding: 16px 22px 15px; }
  .title h1 { font-size: 34px; font-weight: 700; line-height: 1.12; }
  .title p { margin-top: 6px; font-size: 16px; color: var(--ink-2); }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .style { padding: 14px 14px 16px; }
  .pill { display: inline-block; border: 2px solid var(--slate-5); background: var(--chip); color: var(--chip-ink); border-radius: 999px; font-size: 17px; font-weight: 600; padding: 1px 14px 3px; }
  .desc { margin-top: 8px; font-size: 13.5px; line-height: 1.32; color: var(--ink-2); min-height: 36px; }
  .row { margin-top: 11px; }
  .lab { display: flex; justify-content: space-between; align-items: baseline; font-size: 14.5px; color: var(--chip-ink); }
  .lab b { font-size: 17px; font-weight: 700; color: var(--ink); }
  .track { margin-top: 3px; height: 19px; border-radius: 999px; background: var(--track); }
  .bar { height: 100%; border-radius: 999px; background: var(--bar); border: 2px solid var(--slate-5); }
  .row.hl .lab { color: var(--ink); font-weight: 700; }
  .row.hl .lab b { color: var(--picked); }
  .row.hl .bar { background: var(--picked); border-color: var(--picked); }
  .row.weak .lab b { color: var(--red-ink); }
  .row.weak .bar { background: var(--red-bg); border-color: var(--red-ink); }
  .cap { background: #f3f4f6; border-color: #18181b; box-shadow: none; padding: 12px 16px 13px; font-size: 14px; line-height: 1.42; color: var(--chip-ink); }
  .cap b { color: var(--ink); }
</style>
</head>
<body>
<div id="frame">
  <div class="card title">
    <h1>How often the recipe lands on page one</h1>
    <p>Top-6 hit rate by ranker, for three ways of asking. Higher is better.</p>
  </div>
  <div class="styles" id="styles"></div>
  <div class="card cap" id="cap"></div>
</div>
<script>
  const R = DATA.results;
  const RANKERS = [
    ['brute_force', 'Brute force (substring)'],
    ['tfidf', 'TF-IDF (old app)'],
    ['overlap', 'Ingredient overlap'],
    ['embedding', 'Ingredient embeddings'],
    ['learned', 'Learned ranker'],
  ];
  const STYLES = [
    ['typed', 'Typed', '4 ingredients as people type them: Hindi names, plural flips'],
    ['exact', 'Exact', '4 ingredients spelled the way the dataset spells them'],
    ['pantry', 'Pantry', '3/4 of the recipe plus 10 unrelated common ingredients'],
  ];
  const get = (r, q) => R.find((x) => x.ranker === r && x.query === q);
  document.getElementById('styles').innerHTML = STYLES.map(([q, name, desc]) => {
    const rows = RANKERS.map(([key, label]) => {
      const v = get(key, q)['hit@6'] * 100;
      const cls = key === 'learned' ? 'hl' : v < 50 ? 'weak' : '';
      return `<div class="row ${cls}"><div class="lab"><span>${label}</span><b>${v.toFixed(1)}%</b></div>
        <div class="track"><div class="bar" style="width:${v}%"></div></div></div>`;
    }).join('');
    return `<div class="card style"><span class="pill">${name}</span><p class="desc">${desc}</p>${rows}</div>`;
  }).join('');
  const n = get('learned', 'typed').n.toLocaleString('en-US');
  const emb = (get('embedding', 'pantry')['hit@6'] * 100).toFixed(1);
  document.getElementById('cap').innerHTML =
    `Each query is built from a held-out recipe&rsquo;s own ingredients; a hit means that recipe ranks in the top 6, the app&rsquo;s first page. ` +
    `<b>${n} test queries per style</b>, recipes split by id. No human queries or judgements. ` +
    `Ingredient embeddings drop to ${emb}% on pantry queries: ten extra ingredients drag the averaged vector towards generic recipes.`;
  window.READY = true;
</script>
</body>
</html>
