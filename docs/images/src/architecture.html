<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RecipeSense architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 20px; }
  #frame { width: 1500px; background: #fcfbf8; }
  svg { display: block; }
</style>
</head>
<body>
<div id="frame"><svg id="svg" width="1500" height="1080" viewBox="0 0 1500 1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
// One request through RecipeSense, drawn as a block diagram.
// Numbers come from DATA.examples (examples.json) where it has them; the rest
// are constants from the code: recsys/ranker.py, recsys/embeddings.py,
// recsys/service.py, recsys/similar.py, models/ranker.json, data/recipes.csv.
const ex = DATA.examples;
const ie = ex.ingredients_example;
const sh = ex.shapes;
const t = ex.api_timings;
const fmt = (x) => x.toLocaleString('en-US');
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[(s.length - 1) >> 1]; };
const N = ex.catalogue.recipes;                 // 6521
const NS = fmt(N);
const RAW_ROWS = 7540, TFIDF_WORDS = 1308, TREES = 99, LEAVES = 31;
const TRAIN_Q = 7599, VALID_Q = 1880, PER_RANKER = 50, WINDOW = 34;
const shp = (a) => `[${a.join(', ')}]`;

const C = {
  ink: '#1e293b', ink2: '#334155', grey: '#64748b', light: '#94a3b8', hair: '#d9d5cc',
  accent: '#15803d', panel: '#f2f0ea', bluePanel: '#edf1f7',
};
const ST = {
  plain:   { fill: '#ffffff', stroke: '#8e9aab' },
  green:   { fill: '#e5f1e8', stroke: '#15803d' },
  amber:   { fill: '#fbf1d6', stroke: '#c08b22' },
  blue:    { fill: '#e6ecf5', stroke: '#52709c' },
  offline: { fill: 'url(#hatch)', stroke: '#8e9aab', dash: '4 3' },
};
const FONT = { serif: 'Gelasio, Georgia, serif', sans: 'Inter, sans-serif', mono: '"JetBrains Mono", monospace' };

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let out = [];
const add = (s) => out.push(s);

function text(x, y, s, o = {}) {
  const f = FONT[o.f || 'sans'];
  add(`<text x="${x}" y="${y}" font-family='${f}' font-size="${o.size || 12}" font-weight="${o.w || 400}"` +
      ` fill="${o.fill || C.ink}" text-anchor="${o.a || 'start'}"${o.fit ? ` data-fit="${o.fit}"` : ''}` +
      `${o.italic ? ' font-style="italic"' : ''}>${o.raw ? s : esc(s)}</text>`);
}
function rect(x, y, w, h, st, r = 6) {
  add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${st.fill}" stroke="${st.stroke}"` +
      ` stroke-width="${st.sw || 1.3}"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/>`);
}
// A "3D" stack: back layers offset up and to the right, front box last.
function stack(x, y, w, h, st, n = 3, d = 6, backDash = false) {
  for (let i = n - 1; i >= 1; i--) {
    const back = backDash ? { fill: C.panel === st.fill ? st.fill : st.fill, stroke: st.stroke, dash: '3 3' } : st;
    rect(x + i * d, y - i * d, w, h, back);
  }
  rect(x, y, w, h, st);
}
function arrow(pts, o = {}) {
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
  add(`<path d="${d}" fill="none" stroke="${o.color || C.ink2}" stroke-width="1.4"` +
      `${o.dash ? ' stroke-dasharray="5 4"' : ''}${o.head === false ? '' : ` marker-end="url(#${o.marker || 'ah'})"`}/>`);
}
function line(pts, o = {}) { arrow(pts, { ...o, head: false }); }
function label(x, y, s, o = {}) { text(x, y, s, { f: 'mono', size: 11, fill: C.grey, ...o }); }

// Seeded random, so the shaded cells are the same on every build.
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };
}
const RAMP = {
  amber: ['#fbf0d2', '#f3d898', '#e0b35a', '#bf8a2c', '#8c5f14'],
  blue:  ['#e4ebf5', '#c1d0e6', '#8fa9cf', '#5b7cad', '#304f80'],
  ink:   ['#8c5f14'],
};
// Grid of cells. groups: column counts with a wider gap between groups.
function grid(x, y, cols, rows, o = {}) {
  const cs = o.cs || 6, gap = o.gap || 1.2, r = rng(o.seed || 1), ramp = RAMP[o.ramp || 'amber'];
  const groups = o.groups || [cols];
  let cx = x;
  const xs = [];
  groups.forEach((g, gi) => { for (let i = 0; i < g; i++) { xs.push(cx); cx += cs + gap; } cx += o.groupGap || 0; });
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const v = r();
    let fill;
    if (o.sparse) fill = v < o.sparse ? ramp[ramp.length - 1 - Math.floor(r() * 2)] : '#ffffff';
    else fill = ramp[Math.min(ramp.length - 1, Math.floor(v * ramp.length))];
    add(`<rect x="${xs[i].toFixed(1)}" y="${(y + j * (cs + gap)).toFixed(1)}" width="${cs}" height="${cs}" rx="0.8"` +
        ` fill="${fill}" stroke="${o.sparse ? '#e3ded3' : 'none'}" stroke-width="0.6"/>`);
  }
  const w = xs[xs.length - 1] + cs - x, h = rows * (cs + gap) - gap;
  return { w, h };
}
// A grid tile with frames stacked behind it (one frame per recipe row block).
function tile(x, y, cols, rows, o = {}) {
  const cs = o.cs || 6, gap = o.gap || 1.2, pad = 3;
  const w = cols * (cs + gap) - gap + 2 * pad, h = rows * (cs + gap) - gap + 2 * pad;
  const frame = { fill: '#ffffff', stroke: o.frame || '#b9b2a4', dash: o.dash, sw: 1 };
  for (let i = (o.layers || 1) - 1; i >= 1; i--) rect(x + i * 4, y - i * 4, w, h, frame, 3);
  rect(x, y, w, h, frame, 3);
  grid(x + pad, y + pad, cols, rows, o);
  if (o.hiRow != null) {
    add(`<rect x="${x + 1.5}" y="${y + pad + o.hiRow * (cs + gap) - 1.5}" width="${w - 3}" height="${cs + 3}" rx="1.5"` +
        ` fill="none" stroke="${C.accent}" stroke-width="1.4"/>`);
  }
  return { w, h };
}
function tree(x, y, s) {   // tiny decision tree glyph, root at (x, y)
  const pts = [[x, y], [x - s, y + s], [x + s, y + s], [x - 1.5 * s, y + 2 * s], [x - 0.5 * s, y + 2 * s], [x + 0.5 * s, y + 2 * s], [x + 1.5 * s, y + 2 * s]];
  const edges = [[0, 1], [0, 2], [1, 3], [1, 4], [2, 5], [2, 6]];
  edges.forEach(([a, b]) => add(`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${C.accent}" stroke-width="1.1"/>`));
  pts.forEach(([px, py], i) => add(`<circle cx="${px}" cy="${py}" r="${i < 3 ? 2.6 : 2.1}" fill="${i < 3 ? '#ffffff' : C.accent}" stroke="${C.accent}" stroke-width="1.1"/>`));
}
const short = (title) => title.replace(/\s*\bRecipe\b/g, '').split(/ \|| -(?=\S)/)[0].trim();

// ---------- defs ----------
add(`<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="${C.ink2}"/></marker>
  <marker id="ahg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="${C.accent}"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="6" height="6" fill="#f7f5f0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e4dfd4" stroke-width="1.3"/>
  </pattern>
</defs>`);
add(`<rect width="1500" height="1080" fill="#fcfbf8"/>`);

// ---------- title, subtitle, legend ----------
text(48, 78, 'RecipeSense, one request', { f: 'serif', size: 40, w: 600 });
text(49, 112, `${NS} recipes · ${fmt(ex.catalogue.ingredients)} ingredients · ${sh.ingredient_vectors[1]}-d ingredient vectors · ${sh.text_matrix[1]}-d text vectors · ${TREES} trees`,
  { f: 'mono', size: 13, fill: C.grey });

const LEG = [
  [868, 48, 'plain', 'plain step'], [1052, 48, 'green', 'learned model'], [1236, 48, 'amber', 'scores, matrices'],
  [868, 80, 'blue', 'text-embedding path'], [1052, 80, 'offline', 'built offline'], [1236, 80, 'stack', 'repeated: rows, trees, layers'],
];
LEG.forEach(([x, y, k, s]) => {
  if (k === 'stack') { rect(x + 8, y - 12, 20, 13, ST.plain, 3); rect(x + 4, y - 8, 20, 13, ST.plain, 3); rect(x, y - 4, 20, 13, ST.plain, 3); }
  else rect(x, y - 8, 28, 16, ST[k], 4);
  text(x + 40, y + 4.5, s, { size: 13, fill: C.ink2 });
});
text(868, 116.5, '[6521, 64]', { f: 'mono', size: 11.5, fill: C.grey });
text(953, 116.5, 'array shape, rows first', { size: 13, fill: C.ink2 });
line([[1150, 112], [1186, 112]], { dash: true, color: C.accent });
add(`<path d="M1186,112 l-6,-3.5 v7 z" fill="${C.accent}"/>`);
text(1196, 116.5, 'taste from liked recipes', { size: 13, fill: C.ink2 });

// ================= INGREDIENT SEARCH (main panel) =================
const MX = 410;                                   // main axis
add(`<rect x="40" y="240" width="780" height="810" rx="14" fill="${C.panel}"/>`);
text(64, 268, 'Ingredient search', { f: 'serif', size: 18, w: 600 });
text(800, 268, `${t.recommend_median_ms} ms`, { size: 14, w: 600, fill: C.accent, a: 'end' });

// Output: top results and the real top 3
rect(260, 166, 300, 48, ST.plain);
text(MX, 187, 'Top results', { f: 'serif', size: 16, w: 600, a: 'middle' });
text(MX, 205, 'scores scaled 0 to 1', { size: 11, fill: C.grey, a: 'middle' });
arrow([[560, 190], [588, 190]]);
ie.top.slice(0, 3).forEach((r, i) => {
  const y = 175 + i * 21;
  text(596, y + 4, String(i + 1), { size: 11, fill: C.grey });
  text(609, y + 4, short(r.title), { size: 12.5, fill: C.ink, fit: 122 });
  add(`<rect x="738" y="${y - 3}" width="44" height="6" rx="1.5" fill="#e6e1d6"/>`);
  add(`<rect x="738" y="${y - 3}" width="${(44 * r.score).toFixed(1)}" height="6" rx="1.5" fill="${C.accent}"/>`);
  text(815, y + 4, r.score.toFixed(2), { f: 'mono', size: 11, fill: C.ink2, a: 'end' });
});

// Filters and boosts
arrow([[MX, 280], [MX, 216]]);
label(MX + 8, 262, 'top 24');
rect(230, 280, 360, 50, ST.plain);
text(MX, 300, 'Filters and boosts', { f: 'serif', size: 16, w: 600, a: 'middle' });
text(MX, 319, 'veg is a filter · cuisine +0.2 · course +0.3 · likes +0.3', { size: 11.5, fill: C.grey, a: 'middle' });

// LightGBM
arrow([[MX, 364], [MX, 332]]);
label(MX + 8, 352, `scores [${ie.candidates}]`);
stack(260, 376, 300, 56, ST.green, 3, 6);
tree(284, 391, 6); tree(308, 391, 6); tree(332, 391, 6);
text(356, 400, 'LightGBM lambdarank', { f: 'serif', size: 16, w: 600 });
text(356, 419, `${LEAVES} leaves a tree · trained offline`, { size: 11, fill: C.grey });
text(586, 412, `×${TREES}`, { f: 'serif', size: 19, w: 600, fill: C.accent });

// Feature matrix
arrow([[MX, 464], [MX, 434]]);
label(MX + 8, 453, `[${ie.candidates}, ${ie.n_features}]`);
rect(60, 464, 740, 110, ST.amber);
rect(74, 474, 192, 92, { fill: '#ffffff', stroke: '#c9b48a', sw: 1 }, 3);
grid(80, 479, 18, 9, { cs: 8, gap: 1.5, groups: [3, 6, 5, 4], groupGap: 4, seed: 11, ramp: 'amber' });
text(282, 488, 'Feature matrix', { f: 'serif', size: 16, w: 600 });
text(410, 488, `one row per candidate · ${shp([ie.candidates, ie.n_features])}`, { size: 11.5, fill: C.grey });
const FAM = [
  ['ranker scores', 'emb_cos tfidf_cos overlap'],
  ['coverage', 'matched query_cov recipe_cov idf_query_cov idf_recipe_cov soft_cov'],
  ['sizes', 'recipe_len extra n_items n_keys n_missing'],
  ['gap to best', 'emb_gap tfidf_gap overlap_gap soft_gap'],
];
FAM.forEach(([k, v], i) => {
  text(282, 510 + i * 16, k, { size: 11, fill: C.grey });
  text(372, 510 + i * 16, v, { f: 'mono', size: 10.5, fill: C.ink2 });
});

// Union
arrow([[MX, 604], [MX, 576]]);
label(MX + 8, 594, `candidate ids [${ie.candidates}]`);
rect(290, 604, 240, 44, ST.plain);
text(MX, 623, 'Union of candidates', { f: 'serif', size: 15, w: 600, a: 'middle' });
text(MX, 640, `at most ${3 * PER_RANKER} · here ${ie.candidates}`, { f: 'mono', size: 10.5, fill: C.grey, a: 'middle' });

// Three cheap rankers
const RK = [
  { c: 170, title: 'TF-IDF', sub: 'on the words as typed', foot: 'binary weights, cosine',
    tile: { sparse: 0.16, seed: 3 }, s1: shp([N, TFIDF_WORDS]), s2: 'recipe × word' },
  { c: 410, title: 'Ingredient overlap', sub: 'IDF-weighted coverage', foot: '+ 0.4 × share of recipe covered',
    tile: { sparse: 0.11, seed: 5 }, s1: shp([N, ex.catalogue.ingredients]), s2: 'recipe × ingredient' },
  { c: 650, title: 'Ingredient embedding', sub: 'cosine of IDF-weighted vectors', foot: 'query = IDF-weighted mean',
    tile: { seed: 7, dash: '3 2', frame: '#8e9aab' }, s1: shp(sh.ingredient_vectors), s2: 'skip-gram, offline' },
];
RK.forEach((r) => {
  const x = r.c - 105, y = 712;
  stack(x, y, 210, 130, ST.plain, 3, 6);
  text(r.c, y + 24, r.title, { f: 'serif', size: 16, w: 600, a: 'middle' });
  text(r.c, y + 42, r.sub, { size: 11.5, fill: C.grey, a: 'middle' });
  tile(x + 16, y + 54, 10, 6, { cs: 5.6, gap: 1.2, ramp: 'amber', ...r.tile });
  text(x + 102, y + 72, r.s1, { f: 'mono', size: 10.5, fill: C.ink2 });
  text(x + 102, y + 88, r.s2, { size: 10.5, fill: C.grey });
  text(r.c, y + 120, r.foot, { size: 10.5, fill: C.grey, a: 'middle' });
});
// ranker outputs into the union
arrow([[170, 700], [170, 668], [350, 668], [350, 650]]);
arrow([[410, 700], [410, 650]]);
arrow([[650, 700], [650, 668], [470, 668], [470, 650]]);
RK.forEach((r) => label(r.c + 8, 692, `[${N}] → top ${PER_RANKER}`));

// Resolve
rect(300, 884, 470, 90, ST.plain);
text(316, 906, 'Resolve', { f: 'serif', size: 16, w: 600 });
['exact name or one of ' + ex.catalogue.aliases + ' aliases', 'spelling and plural folding', 'char 2–4-gram match, cosine ≥ 0.70']
  .forEach((s, i) => text(316, 927 + i * 16, `${i + 1}  ${s}`, { size: 11.5, fill: C.ink2 }));
line([[540, 894], [540, 964]], { color: '#e3ded3' });
ie.resolved.forEach((r, i) => {
  const y = 903 + i * 15.5;
  text(626, y, r.typed, { f: 'mono', size: 10.5, fill: C.grey, a: 'end' });
  text(640, y, '→', { f: 'mono', size: 10.5, fill: C.light, a: 'middle' });
  const fz = r.via.match(/\(([\d.]+)\)/);
  text(654, y, esc(r.canonical) + (fz ? `<tspan fill="${C.accent}" dx="7">${fz[1]}</tspan>` : ''),
    { f: 'mono', size: 10.5, fill: C.ink, raw: true });
});
// ids up to overlap and embedding
line([[535, 884], [535, 864]]);
line([[410, 864], [650, 864]]);
arrow([[410, 864], [410, 844]]);
arrow([[650, 864], [650, 844]]);
label(543, 879, `canonical ids [${ie.resolved.length}]`);

// Request
rect(110, 1004, 590, 32, ST.plain);
text(126, 1024.5, 'typed', { size: 11.5, fill: C.grey });
text(422, 1024.5, ie.typed.map((s) => `"${s}"`).join(', '), { f: 'mono', size: 12.5, fill: C.ink, a: 'middle' });
arrow([[170, 1004], [170, 844]]);
label(178, 940, `raw strings [${ie.typed.length}]`);
arrow([[535, 1004], [535, 976]]);

// ================= FREE-TEXT SEARCH =================
const se = ex.search_example;
add(`<rect x="860" y="170" width="600" height="280" rx="14" fill="${C.bluePanel}"/>`);
text(880, 197, 'Free-text search', { f: 'serif', size: 17, w: 600 });
text(1440, 197, `${t.search_median_ms} ms`, { size: 14, w: 600, fill: C.accent, a: 'end' });
rect(880, 216, 200, 60, ST.plain);
text(894, 234, 'query', { size: 11, fill: C.grey });
const qw = se.query.split(' ');
const q1 = qw.slice(0, 3).join(' '), q2 = qw.slice(3).join(' ');
text(894, 251, `"${q1}`, { f: 'mono', size: 11.5, fill: C.ink });
text(894, 267, `${q2}"`, { f: 'mono', size: 11.5, fill: C.ink });
arrow([[1080, 246], [1128, 246]]);
stack(1130, 216, 170, 60, ST.blue, 3, 5, true);
text(1215, 237, 'MiniLM encoder', { f: 'serif', size: 15, w: 600, a: 'middle' });
text(1215, 253, 'all-MiniLM-L6-v2', { f: 'mono', size: 10.5, fill: C.ink2, a: 'middle' });
text(1215, 268, 'mean-pooled, unit length', { size: 10.5, fill: C.grey, a: 'middle' });
text(1318, 252, '×6', { f: 'serif', size: 17, w: 600, fill: '#52709c' });
text(1318, 268, 'layers', { size: 10.5, fill: C.grey });
arrow([[1215, 276], [1215, 310]]);
text(1223, 298, 'query vector', { size: 11, fill: C.grey });
label(1297, 298, `[${sh.text_matrix[1]}]`);
grid(1342, 291, 12, 1, { cs: 6, gap: 1.2, ramp: 'blue', seed: 21 });
// cosine against the text matrix
rect(1150, 312, 290, 118, ST.plain);
text(1166, 334, 'Cosine against every recipe', { f: 'serif', size: 15, w: 600 });
tile(1166, 354, 14, 7, { cs: 5.6, gap: 1.2, ramp: 'blue', seed: 23, layers: 3, dash: '3 2', frame: '#8e9aab' });
text(1286, 370, shp(sh.text_matrix), { f: 'mono', size: 10.5, fill: C.ink2 });
text(1286, 386, 'text_embeddings.npy', { f: 'mono', size: 10, fill: C.grey });
text(1286, 402, 'unit rows: dot = cosine', { size: 10.5, fill: C.grey });
arrow([[1150, 392], [1112, 392]]);
label(1131, 385, `[${N}]`, { a: 'middle', size: 10 });
rect(880, 312, 230, 118, ST.plain);
text(894, 330, 'top results', { size: 11, fill: C.grey });
se.top.slice(0, 3).forEach((r, i) => {
  const y = 352 + i * 22;
  text(894, y, String(i + 1), { size: 11, fill: C.grey });
  text(907, y, short(r.title), { size: 11.5, fill: C.ink, fit: 160 });
  text(1100, y, r.score.toFixed(2), { f: 'mono', size: 10.5, fill: C.ink2, a: 'end' });
});
text(894, 419, 'then the same filters and boosts', { size: 10.5, fill: C.grey });

// ================= MORE LIKE THIS =================
const si = ex.similar_example;
add(`<rect x="860" y="470" width="600" height="270" rx="14" fill="${C.panel}"/>`);
text(880, 497, 'More like this', { f: 'serif', size: 17, w: 600 });
text(1440, 497, `${median(t.similar_2121_ms)} ms`, { size: 14, w: 600, fill: C.accent, a: 'end' });
rect(880, 532, 130, 56, ST.plain);
text(894, 553, `recipe ${si.source_id}`, { f: 'mono', size: 11, fill: C.grey });
text(894, 574, short(si.source), { f: 'serif', size: 14, w: 600 });
line([[1010, 560], [1032, 560]]);
arrow([[1032, 560], [1032, 536], [1058, 536]]);
arrow([[1032, 560], [1032, 596], [1058, 596]]);
rect(1060, 512, 180, 48, ST.plain);
tile(1070, 519, 10, 4, { cs: 5.2, gap: 1.2, ramp: 'amber', seed: 31, hiRow: 1 });
text(1152, 532, 'ingredient row', { size: 11, fill: C.ink2 });
text(1152, 548, shp(sh.recipe_ingredient_vectors), { f: 'mono', size: 10.5, fill: C.grey });
rect(1060, 572, 180, 48, ST.blue);
tile(1070, 579, 10, 4, { cs: 5.2, gap: 1.2, ramp: 'blue', seed: 33, hiRow: 1 });
text(1152, 592, 'text row', { size: 11, fill: C.ink2 });
text(1152, 608, shp(sh.text_matrix), { f: 'mono', size: 10.5, fill: C.grey });
arrow([[1240, 536], [1262, 536], [1262, 556], [1288, 556]]);
arrow([[1240, 596], [1262, 596], [1262, 578], [1288, 578]]);
rect(1290, 540, 150, 54, ST.plain);
text(1302, 559, 'join, each × √0.5', { size: 11.5, fill: C.ink2 });
const dimA = sh.ingredient_vectors[1], dimAll = sh.combined[1];
const sw = 88, swA = sw * dimA / dimAll;
